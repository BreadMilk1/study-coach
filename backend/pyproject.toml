[project]
name = "study-coach-backend"
version = "0.0.1"
description = "Study Coach — Exam Coach Agent (FastAPI + LangGraph)"
requires-python = ">=3.11,<3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2",
    "pypdf>=4.0",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "chromadb>=0.5",
    "httpx>=0.28.1",
    "python-multipart>=0.0.29",
    "ollama>=0.6.2",
    "langchain-ollama>=1.1.0",
    "rank-bm25>=0.2.2",
    "fastembed>=0.8.0",
    "alembic>=1.13",
    "langchain-anthropic>=1.4.3",
    "python-jose[cryptography]>=3.5.0",
    "google-auth[oauthlib]>=2.53.0",
]

[dependency-groups]
dev = [
    "openai>=1.40",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
asyncio_mode = "auto"
